<header class="canac-header">
  <div class="canac-header-inner">
    <div class="canac-header-left">
      <div class="canac-logo">
        <a href="{{ .Site.BaseURL }}">rassai<span class="canac-dot">.</span></a>
      </div>
      <nav class="canac-social">
        <a href="https://github.com/saidrassai" target="_blank" rel="noopener">GitHub</a>
        <a href="https://twitter.com/saidrassai" target="_blank" rel="noopener">X</a>
        <a href="https://www.linkedin.com/in/saidrassai" target="_blank" rel="noopener">LinkedIn</a>
      </nav>
    </div>
    <button id="theme-toggle" class="canac-theme-toggle" aria-label="Toggle theme">
      <span class="canac-theme-icon canac-theme-dark-icon">☀️</span>
      <span class="canac-theme-icon canac-theme-light-icon">🌙</span>
    </button>
  </div>
  <div class="canac-tagline">
    <h1>Security research, reverse engineering & low-level systems.</h1>
    <p class="canac-byline">{{ site.Params.author.name }} — {{ site.Params.author.description }}</p>
  </div>
</header>
