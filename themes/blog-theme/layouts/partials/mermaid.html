<!-- Mermaid.js for diagram rendering (ESM default export; no global) -->
<script type="module">
  import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs";

  const apply = (theme) => {
    mermaid.initialize({
      startOnLoad: true,
      theme,
      themeVariables: {
        primaryColor: "#f5f5f4",
        primaryTextColor: "#0d0d0d",
        primaryBorderColor: "#0d0d0d",
        lineColor: "#757575",
        secondaryColor: "#ffffff",
        tertiaryColor: "#f5f5f4",
        background: "#ffffff",
        mainBkg: "#f5f5f4",
        secondBkg: "#f5f5f4",
        textColor: "#0d0d0d",
        nodeTextColor: "#0d0d0d",
        clusterBkg: "#f5f5f4",
        clusterBorder: "#757575",
        defaultLinkColor: "#757575",
        titleColor: "#0d0d0d",
        edgeLabelBackground: "#ffffff",
        actorBkg: "#f5f5f4",
        actorBorder: "#0d0d0d",
        actorTextColor: "#0d0d0d",
        actorLineColor: "#757575",
        signalColor: "#e30613",
        signalTextColor: "#0d0d0d",
        labelBoxBkgColor: "#f5f5f4",
        labelBoxBorderColor: "#0d0d0d",
        labelTextColor: "#0d0d0d",
        loopTextColor: "#0d0d0d",
        noteBkgColor: "#fef3c7",
        noteTextColor: "#92400e",
        noteBorderColor: "#fcd34d"
      },
      flowchart: { useMaxWidth: true, htmlLabels: true, curve: "basis" },
      sequence: { useMaxWidth: true },
      gantt: { useMaxWidth: true }
    });
    // Code blocks were already parsed by Chroma; re-run mermaid on unparsed ones only.
    mermaid.run({ querySelector: "code.language-mermaid, pre > code.language-mermaid" }).catch(() => {});
  };

  apply("light");
</script>
