[markup]
  [markup.goldmark]
    [markup.goldmark.extensions]
      [markup.goldmark.extensions.passthrough]
        enable = true
        [markup.goldmark.extensions.passthrough.delimiters]
          block = [['\\[', '\\]'], ['$$', '$$']]
          inline = [['\\(', '\\)'], ['$', '$']]
      unsafe = true
  [markup.tableOfContents]
    startLevel = 2
    ordered = false
    endLevel = 3

[markup.goldmark.renderer]
unsafe = true

[markup.highlight]
  style = 'github'
  noClasses = false
  lineNos = false

[outputs]
  home = ['HTML', 'RSS']
  page = ['HTML']
  section = ['HTML', 'RSS']

[taxonomies]
  tag = 'tags'
  category = 'categories'
