baseURL = 'https://saidrassai.github.io/'
languageCode = 'en-us'
title = "saidrassai"
theme = 'blog-theme'
googleAnalytics = "G-PCNGEYW1TG"

[params]
  defaultTheme = 'dark'
  math = false
  [params.author]
    name = 'SAID RASSAI'
    description = 'Data & AI Engineer. Building enterprise RAG systems. Interested in CPU inference optimization, GraphRAG, and agentic workflows.'
    avatar = '/images/avatar.svg'

[markup]
  [markup.goldmark]
    [markup.goldmark.extensions]
      [markup.goldmark.extensions.passthrough]
        enable = true
        [markup.goldmark.extensions.passthrough.delimiters]
          block = [['\\[', '\\]'], ['$$', '$$']]
          inline = [['\\(', '\\)'], ['$', '$']]
      unsafe = true
  [markup.tableOfContents]
    startLevel = 2
    ordered = true
    endLevel = 3

[markup.goldmark.renderer]
unsafe = true

[markup.highlight]
  style = 'nord'
  noClasses = false
  lineNos = false

[outputs]
  home = ['HTML']
  page = ['HTML']

[taxonomies]
  tag = 'tags'
  category = 'categories'
